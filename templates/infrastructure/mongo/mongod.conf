# mongod configuration for the shared instance.
#
# Everything here is a *default that survives a compose edit*. Flags on the command line are easy
# to drop by accident during a hurried deploy; a config file is reviewed in a diff. Where a value
# also appears in docker-compose.prod.yml, this file is the authority and the compose only points
# at it.

storage:
  dbPath: /data/db

net:
  port: 27017
  # Bind all interfaces *inside the container*. This is not the exposure boundary — the network is
  # (`internal: true`, no published ports). Binding only 127.0.0.1 here would break the apps, which
  # reach mongod from other containers.
  bindIp: 0.0.0.0
  # A single request cannot ask mongod to allocate more than this. Default is 16MB per doc; this
  # bounds the wire, not the document.
  maxIncomingConnections: 200

security:
  # **Auth is on, and the keyFile is what makes it possible on a replica set.** A replica set with
  # authorization enabled needs internal authentication between members; a keyFile provides it, and
  # `keyFile` implies `authorization: enabled`. Both are stated anyway — an implied security
  # setting is one nobody sees in a review.
  authorization: enabled
  keyFile: /etc/mongo-keyfile/keyfile

replication:
  # **Unchanged from what __MKTRUE_NAME__ already runs, and that is load-bearing.** The existing data
  # directory carries `rs0`'s configuration in its `local` database. A different name here means
  # mongod refuses to start against that data; the same name means it picks up exactly where
  # __MKTRUE_NAME__'s own mongod left off, with no dump, no restore, and no window in which the data is in
  # flight.
  replSetName: rs0

setParameter:
  # SCRAM-SHA-256 only. SCRAM-SHA-1 is still MongoDB's default alongside 256 for compatibility with
  # old drivers; every driver here is current, so the weaker mechanism is refused rather than
  # merely unused.
  authenticationMechanisms: SCRAM-SHA-256

operationProfiling:
  # Off. The profiler writes query *contents* into system.profile — which for __MKTRUE_NAME__ means journal
  # text in a collection nobody thinks of as journal data. If it is ever turned on for debugging,
  # turn it off again in the same session.
  mode: off
