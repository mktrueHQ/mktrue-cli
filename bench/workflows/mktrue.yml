# Written by mktrue and updated by `mktrue sync`. Your own gates live in ci.yml.
name: mktrue

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: install mktrue __MKTRUE_KIT_VERSION__
        run: |
          mkdir "$RUNNER_TEMP/mktrue"
          cd "$RUNNER_TEMP/mktrue"
          echo '{"private": true}' > package.json
          npm install --ignore-scripts --no-audit --no-fund --save-exact "mktrue@__MKTRUE_KIT_VERSION__"

      - name: verify registry signatures
        run: cd "$RUNNER_TEMP/mktrue" && npm audit signatures

      - name: mktrue check
        run: '"$RUNNER_TEMP/mktrue/node_modules/.bin/mktrue" check'
