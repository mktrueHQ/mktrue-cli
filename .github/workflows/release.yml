name: release

# decision 0031: a v* tag on a snapshot builds and proves the npm package and the
# four binaries (decision 0033), stages the package on npm under next, attests
# every file, and makes a GitHub prerelease with the installer (decision 0035).
# npm is staged, never published: the founder approves it with 2FA, then
# promotes it to latest after the device pass.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: the tag names the package version
        run: test "v$(node -p 'require("./packages/cli/package.json").version')" = "$GITHUB_REF_NAME"

      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The snapshot holds no docs/, so check runs on a fixture, as binaries do.
      - name: check true on a fixture
        run: |
          set -eu
          work="$(mktemp -d)"
          mkdir -p "$work/repo/docs/decisions" "$work/repo/docs/design" "$work/repo/docs/log"
          cp .mktrue.json "$work/repo/"
          printf '# State\n'   > "$work/repo/docs/STATE.md"
          printf '# Roadmap\n' > "$work/repo/docs/ROADMAP.md"
          printf '# Rules\n'   > "$work/repo/CLAUDE.md"
          printf '# Index\n'   > "$work/repo/docs/decisions/index.md"
          printf '# Design\n'  > "$work/repo/docs/design/m1.md"
          printf '# Log\n'     > "$work/repo/docs/log/a.md"
          cd "$work/repo"
          node "$GITHUB_WORKSPACE/packages/cli/dist/mktrue.js" check

      - name: prove the package as a user gets it
        run: node scripts/pack-proof.mjs

      - name: pack the tarball npm receives
        run: |
          set -eu
          export LC_ALL=C
          mkdir -p "$RUNNER_TEMP/npm"
          (cd packages/cli && pnpm pack --pack-destination "$RUNNER_TEMP/npm")
          tarball="$(ls "$RUNNER_TEMP"/npm/mktrue-*.tgz)"
          tar -tzf "$tarball" | sed 's|^package/||' | sort > "$RUNNER_TEMP/packed"
          (cd packages/cli && npm pack --dry-run --json --ignore-scripts) |
            node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].files.map(f=>f.path).join("\n")))' |
            sort > "$RUNNER_TEMP/proved"
          diff "$RUNNER_TEMP/proved" "$RUNNER_TEMP/packed"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm
          path: ${{ runner.temp }}/npm/mktrue-*.tgz
          if-no-files-found: error

  binary:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: build the binary and its release archive
        run: node scripts/build-sea.mjs --out "$RUNNER_TEMP/sea" --archive "$RUNNER_TEMP/release"

      - name: the archive matches its SHA256SUMS line and unpacks to the same binary
        run: |
          set -eu
          cd "$RUNNER_TEMP/release"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c mktrue-*.tar.xz.sha256
          else
            shasum -a 256 -c mktrue-*.tar.xz.sha256
          fi
          mkdir "$RUNNER_TEMP/unpacked"
          tar -xJf mktrue-*.tar.xz -C "$RUNNER_TEMP/unpacked"
          cmp "$RUNNER_TEMP/unpacked/mktrue" "$(ls "$RUNNER_TEMP"/sea/mktrue-*)"

      - name: the binary is ad-hoc signed
        if: runner.os == 'macOS'
        run: codesign --verify --verbose "$RUNNER_TEMP"/sea/mktrue-*

      - name: --help, then check true on a fixture
        run: |
          set -eu
          binary="$RUNNER_TEMP/unpacked/mktrue"
          "$binary" --help
          work="$(mktemp -d)"
          mkdir -p "$work/repo/docs/decisions" "$work/repo/docs/design" "$work/repo/docs/log"
          cp .mktrue.json "$work/repo/"
          printf '# State\n'   > "$work/repo/docs/STATE.md"
          printf '# Roadmap\n' > "$work/repo/docs/ROADMAP.md"
          printf '# Rules\n'   > "$work/repo/CLAUDE.md"
          printf '# Index\n'   > "$work/repo/docs/decisions/index.md"
          printf '# Design\n'  > "$work/repo/docs/design/m1.md"
          printf '# Log\n'     > "$work/repo/docs/log/a.md"
          cd "$work/repo"
          "$binary" check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.runner }}
          path: ${{ runner.temp }}/release/mktrue-*
          if-no-files-found: error

  attest:
    needs: [package, binary]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/mktrue-*.tar.xz
            dist/mktrue-*.tgz

  publish:
    needs: [package, binary]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm
          path: npm
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # Trusted publishing (OIDC) allows staging only: nothing reaches a dist-tag
      # until the founder runs npm stage approve with 2FA.
      - name: stage the tarball under next, with provenance
        run: |
          set -eu
          set -- npm/mktrue-*.tgz
          test "$#" -eq 1
          npm install --global --ignore-scripts npm@11.20.0
          npm stage publish "$(ls npm/mktrue-*.tgz)" --tag next --provenance

  release:
    needs: [attest, publish]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: one SHA256SUMS for the four archives
        run: |
          set -eu
          cd dist
          set -- mktrue-*.tar.xz
          test "$#" -eq 4
          cat mktrue-*.tar.xz.sha256 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
          sha256sum -c SHA256SUMS

      - name: the prerelease, with the four archives, SHA256SUMS and install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --prerelease --verify-tag \
            --title "mktrue $GITHUB_REF_NAME" \
            --notes "Binaries for Linux and macOS, SHA256SUMS and install.sh. npm: mktrue@next once approved." \
            dist/mktrue-*.tar.xz dist/SHA256SUMS install.sh
